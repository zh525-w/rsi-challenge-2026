name: cleanup-v14

on:
  push:
    paths:
      - '.github/workflows/cleanup-v14.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove sync artifacts and workflows
        run: |
          rm -rf pkg src pkg.zip
          rm -f .github/workflows/sync-v14.yml .github/workflows/cleanup-v14.yml
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "chore: remove sync artifacts and temporary workflows" || exit 0
          git push
