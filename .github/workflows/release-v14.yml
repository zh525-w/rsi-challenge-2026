name: release-v14-image

on:
  push:
    paths:
      - '.github/workflows/release-v14.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download image
        run: |
          curl -L --fail --max-time 300 -o rsi-a-cpu-1.0-alpine.tar.gz "https://aka.doubaocdn.com/s/1Qm1wutV1S"
          echo "2ea742bac41071cdeaf6618be05821875010e9de3631bb152f41a95192b0e7fe  rsi-a-cpu-1.0-alpine.tar.gz" | sha256sum -c -
      - name: Create release with asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v14-image rsi-a-cpu-1.0-alpine.tar.gz \
            --title "v14 CPU image" \
            --notes "rsi-a-cpu-1.0-alpine.tar.gz (gzip of docker save tar, 38,461,103 B; inner tar sha256 0eeee06618140d113367c1a7c6bc6b3e356cdb568b6445d59ffd54350a5321ef)"
